[project]
name = "app-linux-vuln-sentinel"
version = "0.1.0"
description = "Linux intelligent integrated operations platform"
readme = "README.md"
authors = [
    { name = "Konghaoran", email = "konghaoran@tkjtkj.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.16.5",
    "cryptography==45.0.7",
    "fastapi==0.116.1",
    "paramiko==4.0.0",
    "pymysql==1.1.1",
    "python-docx==1.2.0",
    "reportlab==4.4.4",
    "psycopg[binary]==3.2.10",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "uvicorn[standard]==0.35.0",
    "pwdlib[argon2]>=0.3.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pypdf==6.0.0",
    "ruff==0.12.12",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
